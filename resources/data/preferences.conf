#show/hide specific details#
displaySize = True #bolean to state if you want the application to display the size of all known dies (and the site on which the die was found) in the selector or not
max_recents = 5 #max number of items kept and displayed in the recent tab

#zoom management#
max_zoom = 4.0 #maximum zoom factor allowed on the die picture
zoom_step = 1.15 #zoom multiplier applied per mouse wheel "notch" (120 units of angleDelta)
remove_measurement_for_pan = False #if True, remove the measurement lines when a lateral pan is made on the picture (when picture is zoomed); in case of a zoom, lines will always be removed


